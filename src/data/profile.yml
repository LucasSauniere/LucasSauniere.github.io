intro:
  - "I am a <strong>Doctor in Optics, Photonics and Image Processing</strong>, having defended my PhD thesis on January 29th, 2026, at the <a href='https://www.cppm.in2p3.fr/' target='_blank' rel='noopener'>Centre de Physique des Particules de Marseille (CPPM)</a>, France. My work comes at the intersection of <strong>optical instrumentation</strong>, <strong>image processing</strong>, and <strong>machine learning</strong>, with a strong focus on space science applications."
  - "My PhD focused on <strong>modeling the instrumental response of the <a href='https://www.esa.int/Science_Exploration/Space_Science/Euclid' target='_blank' rel='noopener'>Euclid</a> NISP instrument</strong>, within the <strong><a href='https://dispers.in2p3.fr/index.html' target='_blank' rel='noopener'>DISPERS project</a></strong>. I developed methods combining <strong>Zernike polynomial decomposition</strong> and <strong>deep learning</strong> to characterize optical aberrations from PSFs."

beyond_research: "I enjoy applying AI and machine learning to diverse and creative problems. I am also a passionate astronomer and former <strong>Vice-President of the IPSA VEGA astronomy association</strong>, where I contributed to data analysis from Kepler/K2 and TESS missions and taught astrophotography to fellow students."

postdoc: "I am currently seeking a <strong>postdoc position in Canada or the United States</strong> in optical systems, computational imaging, machine learning for science, or space instrumentation. Feel free to <a href='mailto:lucas.sauniere@ipsa.fr'>reach out</a> — I would love to discuss opportunities!"